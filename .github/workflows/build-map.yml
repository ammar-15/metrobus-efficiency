name: Build map from the Metrobus feed

# Downloads the latest Metrobus GTFS feed, runs the planner and commits the
# results: docs/data/plan.json (the web map) and results/ (summary, CSVs, image).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "results/**"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1" # Mondays, to pick up schedule changes

permissions:
  contents: write

concurrency:
  group: build-map
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: pytest -q

      - name: Run the planner on the real feed
        run: python -m metrobus_efficiency --web docs/data/plan.json

      - name: Copy results
        run: |
          mkdir -p results
          cp output/summary.md output/lines.csv output/stops_plan.csv output/plan.png output/network.geojson results/
          cat output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/plan.json results/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update map from the Metrobus feed"
            git push
          fi
